[project]
name = "batchcode"
version = "1.0.0b0"
description = "Transcode video files en masse from set profiles with HandBrake."
authors = [
    { name = "Noah S. Roberts", email = "35052448+Mase3206@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
manage = "batchcode.__main__:main"


# Ruff settings

# [tool.ruff]
# include = ["src/bitterroot/**/*.py"]

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "W291", "F401", "I"
]
[tool.ruff.lint.isort]
combine-as-imports = true

[dependency-groups]
dev = [
    "ruff>=0.15.7",
]
